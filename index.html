<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>외계 환경 미생물 시뮬레이터</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="main-panel">
        <header class="topbar">
          <div>
            <h1>외계 환경 미생물 시뮬레이터</h1>
            <p>천체별 환경장을 만들고, 미생물이 온도·방사선·염도·화학에너지 조건에 맞는 위치로 이동하는지 관찰합니다.</p>
          </div>
          <div class="time-box">
            <span>경과 시간</span>
            <strong id="yearValue">0</strong>
            <small>년</small>
          </div>
        </header>

        <canvas id="field" width="1040" height="650" aria-label="천체 환경장 시뮬레이션"></canvas>

        <section class="meters">
          <div><span>개체군</span><strong id="populationValue">0</strong><div class="meter"><div id="populationBar"></div></div></div>
          <div><span>활성 대사</span><strong id="activeValue">0</strong><div class="meter"><div id="activeBar"></div></div></div>
          <div><span>대사산물</span><strong id="productValue">0</strong><div class="meter"><div id="productBar"></div></div></div>
          <div><span>테라포밍 지표</span><strong id="terraformValue">0</strong><div class="meter"><div id="terraformBar"></div></div></div>
        </section>
      </section>

      <aside class="side-panel">
        <section>
          <h2>실험</h2>
          <div class="actions">
            <button id="playButton" type="button">실행</button>
            <button id="stepButton" type="button">100년 진행</button>
            <button id="resetButton" type="button">초기화</button>
          </div>
        </section>

        <section>
          <h2>천체 프리셋</h2>
          <div class="choices" id="worldChoices"></div>
        </section>

        <section>
          <h2>환경 보정</h2>
          <div class="sliders" id="sliders"></div>
        </section>

        <section>
          <h2>미생물</h2>
          <div class="choices" id="microbeChoices"></div>
        </section>

        <section class="readout">
          <h2>미세환경 적합도</h2>
          <div id="zoneReadout"></div>
        </section>

        <section class="readout">
          <h2>판정</h2>
          <p id="verdict"></p>
        </section>

        <section class="sources">
          <h2>출처와 기준</h2>
          <p id="modelNote"></p>
          <div id="sourceLinks"></div>
        </section>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
