<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>외계 천체 테라포밍 시뮬레이터</title>
    <link rel="stylesheet" href="styles.css?v=space-graph-2" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <strong>극한생물 테라포밍 실험</strong>
          <span id="clock">0 sol</span>
        </div>
        <label class="select-control">
          천체
          <select id="worldSelect"></select>
        </label>
        <label class="select-control">
          생물
          <select id="organismSelect"></select>
        </label>
        <label class="speed-control">
          시간
          <input id="speedRange" type="range" min="0" max="80" value="18" />
          <strong id="speedLabel">18x</strong>
        </label>
        <button id="resetBtn" type="button">재시작</button>
      </header>

      <section class="stage" id="stage" aria-label="천체 환경 시뮬레이션">
        <canvas id="field"></canvas>
        <div class="world-name">
          <h1 id="worldName"></h1>
          <p id="worldLine"></p>
        </div>
        <div class="legend">
          <span><i class="temp"></i>온도</span>
          <span><i class="salt"></i>염도</span>
          <span><i class="rad"></i>방사선</span>
          <span><i class="life"></i>생물</span>
        </div>
      </section>

      <aside class="hud">
        <section class="panel atmosphere">
          <div class="panel-title">
            <h2>대기 조성</h2>
            <strong id="habitability">0%</strong>
          </div>
          <canvas id="gasChart" aria-label="대기 조성 변화 그래프"></canvas>
          <div id="gasBars" class="gas-bars"></div>
        </section>
        <section class="panel stats">
          <div>
            <span>개체 수</span>
            <strong id="population">0</strong>
          </div>
          <div>
            <span>평균 적합도</span>
            <strong id="fitness">0%</strong>
          </div>
          <div>
            <span>테라포밍</span>
            <strong id="terraform">0%</strong>
          </div>
          <div>
            <span>주요 대사</span>
            <strong id="metabolism">-</strong>
          </div>
        </section>
      </aside>

      <footer class="source">
        NASA Mars · NASA Europa Clipper · NASA Cassini Enceladus 기반, 내부 수치는 발표용 단순 모델
      </footer>
    </main>
    <script src="app.js?v=space-graph-2"></script>
  </body>
</html>
